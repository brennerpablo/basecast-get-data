[project]
name = "basecast-get-data"
version = "0.1.0"
description = "basecast API: serves the lake, the processed tables and the pipeline runs to basecast-app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastexcel==0.21.0",
    "google-cloud-bigquery==3.45.0",
    "google-cloud-storage==3.14.1",
    "orjson>=3.12.0",
    "polars==1.44.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]==3.3.5",
    "pyarrow==25.0.1",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.3",
    "python-pptx==1.0.2",
    "pyyaml==6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:google.*", "ignore:Using .httpx. with"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest==9.1.1",
    "ruff>=0.16.9",
    "xlsxwriter>=3.2.9",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Depends"]
